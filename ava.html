<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AVA</title>
<link rel="stylesheet" href="style.css" >
</head>
<body>

  <!-- LABELED SETTINGS BAR -->
  <div class="settings">
    <div class="settings-group">
      <label>Brain</label>
      <select id="brainSelect">
        <option value="windows">Windows (agent2win)</option>
        <option value="hermes">Hermes (WSL)</option>
      </select>
    </div>

    <div class="settings-group">
      <label>TTS Engine</label>
      <select id="ttsSelect">
        <option value="piper">Piper (Custom)</option>
        <option value="browser">Browser (Standard)</option>
      </select>
    </div>

    <div class="settings-group">
      <label>Piper URL</label>
      <input id="piperUrl" class="piper-url" placeholder="http://127.0.0.1:5000" value="http://127.0.0.1:5000" />
    </div>

    <div class="settings-group">
      <label>Wake Word</label>
      <label class="switch">
        <input type="checkbox" id="wakeWordToggle">
        <span class="slider"></span>
      </label>
    </div>

    <div class="settings-group">
      <label>agent2win URL</label>
      <input id="apiUrl" placeholder="http://127.0.0.1:7770" value="http://127.0.0.1:7770" />
    </div>

    <div class="settings-group">
      <label>agent2win Key</label>
      <input id="apiKey" placeholder="agent2win Key" type="password" />
    </div>

    <div class="settings-group">
      <label>Hermes Key</label>
      <input id="hermesKey" class="hermes-key" placeholder="Hermes API Key" type="password" />
    </div>

    <div class="settings-group">
      <label>Groq Key</label>
      <input id="groqKey" placeholder="Groq API Key" type="password" />
    </div>
    <div class="settings-group">
      <label>Cloud LLM</label>
      <select id="cloudSelect">
        <option value="groq">Groq</option>
        <option value="openrouter">OpenRouter</option>
      </select>
    </div>
    <div class="settings-group">
      <label>OpenRouter Key</label>
      <input id="openRouterKey" placeholder="OpenRouter Key" type="password" />
    </div>
    <div class="settings-group">
      <label>Groq Model</label>
      <select id="modelSelect">
        <option value="llama-3.2-11b-vision-preview">llama-3.2-11b-vision</option>
        <option value="llama-3.2-90b-vision-preview">llama-3.2-90b-vision</option>
        <option value="openai/gpt-oss-120b" selected>openai/gpt-oss-120b</option>
        <option value="llama-3.3-70b-versatile">llama-3.3-70b</option>
      </select>
    </div>
  </div>

  <div class="logo-wrap" id="logoWrap">
    <canvas id="particles"></canvas>
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
    <div class="ava-text">AVA</div>
  </div>

  <div class="status" id="status">standby</div>
  <button class="mic" id="micBtn" title="Click to talk">🎙️</button>

  <div class="chat-bar">
    <input id="chatInput" placeholder="Ask Ava... (e.g. 'open edge' or 'what is on my screen?')" />
    <button id="sendBtn">SEND</button>
  </div>

  <div class="log" id="log"></div>

  <div class="hud-panel" id="screenshotPanel">
    <div class="hud-header" onclick="document.getElementById('screenshotPanel').classList.remove('active')">
      <span>OPTICAL FEED</span>
      <span style="cursor:pointer; font-size:14px;">✕</span>
    </div>
    <img id="screenshotImg" class="hud-image" src="" alt="Screen Capture" />
  </div>

<script type="module" src="script.js"></script>

  <!-- Vision UI Elements -->
  <div id="cursor" class="off"></div>
  <div id="left-cursor"></div>
  <div id="gesture-display" style="z-index: 1000;">
    <div class="label">Right Hand</div>
    <div class="row"><span>Gesture</span><span class="value" id="right-gesture">—</span></div>
    <div class="label" style="margin-top:8px;">Left Hand</div>
    <div class="row"><span>Gesture</span><span class="value" id="left-gesture">—</span></div>
    <div class="row"><span>Key</span><span class="value" id="left-key">—</span></div>
  </div>
  <!-- Collapsible Keyboard Panel on the Right -->
  <div id="keyboard-panel">
    <div id="keyboard-header" onclick="document.getElementById('keyboard-panel').classList.toggle('collapsed')">
      <span>⌨️ KEYBOARD</span>
      <span id="keyboard-chevron">▶</span>
    </div>
    <div id="keyboard"></div>
  </div>
  <div id="drag-indicator" style="z-index: 1000;">🖱️ DRAGGING (FIST)</div>
  <video id="video" autoplay playsinline style="z-index: 1000;"></video>
</body>
</html>
